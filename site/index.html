<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Proyector electoral</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wdth,wght@75..100,400..700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f2f4f6; --sheet:#ffffff; --ink:#17202a; --muted:#5b6672; --rule:#d3d9df; --ctl:#145c63; --ctl-ink:#ffffff; --band:.18;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --paper:#11161c; --sheet:#171e26; --ink:#e5e9ed; --muted:#8c97a3; --rule:#2a333d; --ctl:#6fc1c4; --ctl-ink:#0c1216; --band:.28;
}}
:root[data-theme="dark"]{ --paper:#11161c; --sheet:#171e26; --ink:#e5e9ed; --muted:#8c97a3; --rule:#2a333d; --ctl:#6fc1c4; --ctl-ink:#0c1216; --band:.28; }
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:16px;line-height:1.5;font-variant-numeric:tabular-nums;-webkit-text-size-adjust:100%}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
a{color:var(--ctl)}
:focus-visible{outline:2px solid var(--ctl);outline-offset:2px;border-radius:3px}

header.top{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:12px;padding:20px 0 14px;border-bottom:1px solid var(--rule)}
.brand{font-weight:700;font-stretch:80%;font-size:1.15rem;letter-spacing:-.01em}
.brand span{color:var(--muted);font-weight:500}
nav.countries{display:flex;gap:4px;background:var(--sheet);border:1px solid var(--rule);border-radius:999px;padding:3px}
nav.countries button{font:inherit;font-size:.95rem;border:0;background:transparent;color:var(--ink);padding:6px 14px;border-radius:999px;cursor:pointer}
nav.countries button[aria-selected="true"]{background:var(--ctl);color:var(--ctl-ink);font-weight:600}

.headline{padding:28px 0 6px}
.headline h1{font-size:clamp(1.7rem,4.6vw,2.7rem);line-height:1.08;font-stretch:78%;font-weight:700;letter-spacing:-.015em;margin:0 0 8px;max-width:22ch}
.headline p{margin:0;color:var(--muted);max-width:68ch}

.grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:28px;padding:22px 0}
@media (max-width:820px){.grid{grid-template-columns:minmax(0,1fr);gap:20px}}

.cands{display:flex;flex-direction:column;gap:16px}
.cand .row1{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.cand .name{font-weight:600}
.cand .pct{font-stretch:75%;font-weight:700;font-size:2.3rem;line-height:1}
.cand .ci{color:var(--muted);font-size:.9rem;margin-left:6px;font-stretch:90%}
.track{position:relative;height:10px;background:var(--rule);border-radius:5px;margin-top:6px}
.track .bar{position:absolute;left:0;top:0;bottom:0;border-radius:5px}
.track .band{position:absolute;top:-3px;bottom:-3px;border-radius:3px}
.track .tick{position:absolute;top:-5px;width:2px;height:20px;background:var(--ink)}
.cand .sub{font-size:.85rem;color:var(--muted);margin-top:6px}

.outcome{background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:18px 18px 16px}
.outcome h2{font-size:1rem;margin:0 0 10px;font-weight:600}
.big{font-stretch:75%;font-weight:700;font-size:2rem;line-height:1.1}
.outcome .line{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px solid var(--rule);font-size:.95rem}
.outcome .line:first-of-type{border-top:0}
.outcome .note{font-size:.82rem;color:var(--muted);margin-top:10px}
.ev{display:flex;height:22px;border-radius:4px;overflow:hidden;margin:10px 0 4px;position:relative;background:var(--rule)}
.ev div{height:100%}
.ev .half{position:absolute;left:50%;top:-4px;bottom:-4px;width:2px;background:var(--ink)}

section.chart{padding:8px 0 4px}
.chart h2,.regions h2,.method h2{font-size:1.25rem;font-stretch:85%;margin:24px 0 4px}
.legend{display:flex;flex-wrap:wrap;gap:16px;font-size:.85rem;color:var(--muted);margin:4px 0 8px}
.legend i{display:inline-block;width:22px;height:0;border-top:3px solid currentColor;vertical-align:middle;margin-right:6px}
.legend i.dash{border-top-style:dashed;border-top-width:2px}
.legend i.dot{border-top-style:dotted;border-top-width:2px}
.svgwrap{background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:8px 6px 2px}
svg{display:block;width:100%;height:auto}
svg text{font-family:inherit;fill:var(--muted);font-size:12px}
.scrub{display:flex;flex-wrap:wrap;align-items:center;gap:10px 12px;padding:12px 2px}
.scrub button{font:inherit;font-weight:600;border:1px solid var(--ctl);background:var(--ctl);color:var(--ctl-ink);border-radius:999px;padding:7px 16px;cursor:pointer;min-width:96px}
.scrub input{flex:1 1 160px;accent-color:var(--ctl);min-width:0}
.scrub output{font-stretch:85%;min-width:9ch;text-align:right;color:var(--muted)}

.regions .tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:6px 0 10px}
.regions select{font:inherit;padding:6px 8px;border-radius:6px;border:1px solid var(--rule);background:var(--sheet);color:var(--ink)}
.tablewrap{overflow-x:auto;background:var(--sheet);border:1px solid var(--rule);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{padding:8px 12px;text-align:right;border-bottom:1px solid var(--rule);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font-weight:600;color:var(--muted);font-size:.85rem}
tr:last-child td{border-bottom:0}
.mbar{display:inline-block;width:90px;height:8px;background:var(--rule);border-radius:4px;position:relative;vertical-align:middle;margin-left:8px}
.mbar span{position:absolute;top:0;bottom:0;border-radius:4px}
.mbar::after{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:var(--ink)}
.more{font:inherit;margin-top:10px;background:none;border:0;color:var(--ctl);cursor:pointer;padding:4px 0;font-weight:600}

.method{padding-bottom:48px}
.method p{max-width:70ch}
.method table td:first-child{font-weight:600}
.best{font-weight:700;color:var(--ink)}
.empty{background:var(--sheet);border:1px dashed var(--rule);border-radius:10px;padding:22px;margin:22px 0}
.empty h2{margin-top:0;font-stretch:85%}
.empty code{font-size:.9em;background:var(--paper);padding:1px 5px;border-radius:4px}
.empty ol{padding-left:20px}
footer{border-top:1px solid var(--rule);padding:16px 0 40px;color:var(--muted);font-size:.85rem}
.changes .lead{font-size:1.05rem;max-width:68ch;margin:6px 0 14px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:8px 0 18px}
.card{background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:12px 14px}
.card .k{font-size:.85rem;color:var(--muted)}
.card .v{font-stretch:75%;font-weight:700;font-size:1.7rem;line-height:1.1}
.card .s{font-size:.8rem;color:var(--muted)}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px}
@media (max-width:820px){.two{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:12px 12px 8px}
.panel h3{font-size:1rem;margin:0 0 2px}
.panel .cap{font-size:.82rem;color:var(--muted);margin:0 0 8px}
.flips{font-size:.9rem;margin:0;padding-left:18px}
.flips li{margin:2px 0}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">Proyector <span>escrutinio</span></div>
    <nav class="countries" role="tablist" aria-label="País"></nav>
  </header>
  <main id="app"></main>
  <footer>Proyección no oficial con fines de análisis. Modelo: ensamble, con pesos iguales, de un modelo jerárquico del cambio respecto de la elección anterior y de la imputación por vecinos ya escrutados. Validado con datos reales de EEUU 2020 y 2024 y de Argentina 2019.</footer>
</div>

<script>
// Configuración base por país (se usa si no hay datos todavía)
const CONFIGS = {
  br:{country:"br",title:"Brasil",office:"Presidente, 1ª vuelta",candidates:{"Lula":"lula","Flávio Bolsonaro":"bolsonaro","Augusto Cury":"otros","Renan Santos":"otros","Otros":"otros"},
      colors:{"Lula":"#c8323a","Flávio Bolsonaro":"#1f4e9c","Augusto Cury":"#c99a1e","Renan Santos":"#6b4fa0","Otros":"#8a8f98"},rule_kind:"two_round",region_label:"Estado",unit_label:"municipios",
      note:"Gana en primera vuelta quien supera el 50% de los votos válidos. Base: 1ª vuelta 2022.",
      setup:["En tu computadora, corré <code>python backtest_pais.py br</code>: baja del TSE los resultados 2018 y 2022 por municipio, valida el método en 2022 y genera esta pestaña.",
             "Corré <code>python -m adapters.br 2022</code> para dejar lista la base de 2026.",
             "Durante el escrutinio: <code>python -m adapters.br_live data/br_actual.csv</code> y después <code>python run_live.py br data/br_actual.csv</code>, cada 2 o 3 minutos. Probá antes el conversor con <code>--uf RR</code>."]},
  us:{country:"us",title:"Estados Unidos",office:"Presidente",rule_kind:"ec"},
  ar:{country:"ar",title:"Argentina",office:"Presidente, primera vuelta",candidates:{"La Libertad Avanza":"lla","Peronismo":"peronismo","Juntos por el Cambio":"jxc","Otros":"otros"},
      colors:{"La Libertad Avanza":"#6b3fa0","Peronismo":"#2a8fd6","Juntos por el Cambio":"#e0b21b","Otros":"#8a8f98"},rule_kind:"two_round",region_label:"Provincia",unit_label:"circuitos",
      note:"Gana en primera vuelta con 45% de los votos afirmativos, o con 40% y 10 puntos de ventaja. Base: primera vuelta 2023.",
      setup:["Bajá los resultados 2023 por mesa de la DINE y corré <code>python -m adapters.ar archivo.csv</code> (agrega por circuito).",
             "Cuando se oficialicen los candidatos 2027, completá el mapeo de frentes en <code>config/ar.json</code>.",
             "Escribí un conversor del escrutinio provisorio y corré <code>python run_live.py ar escrutinio.csv</code>."]}
};
const ORDER = ["br","us","ar"];
const STATE = {country:"us", data:{}, idx:{}, playing:null, showAll:false, sort:"close"};
const $ = s => document.querySelector(s);
const pct = (x,d=1) => (x*100).toFixed(d).replace(".",",")+"%";
const pts = (x,d=1) => (x>=0?"+":"−")+Math.abs(x*100).toFixed(d).replace(".",",");
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

async function load(c){
  if (STATE.data[c] !== undefined) return STATE.data[c];
  let d = (window.__DATA__||{})[c];
  if (!d && !window.__DATA__) { try { const r = await fetch(`data/${c}.json`,{cache:"no-store"}); if (r.ok) d = await r.json(); } catch(e){} }
  STATE.data[c] = d || null;
  if (d) STATE.idx[c] = d.mode === "replay" ? Math.min(10, d.history.length-1) : d.history.length-1;
  return STATE.data[c];
}

function nav(){
  const n = $("nav.countries"); n.innerHTML = "";
  ORDER.forEach(c => {
    const b = document.createElement("button");
    b.textContent = CONFIGS[c].title; b.setAttribute("role","tab");
    b.setAttribute("aria-selected", c===STATE.country); b.onclick = () => { stop(); STATE.country=c; STATE.showAll=false; history.replaceState(null,"","#"+c); render(); };
    n.appendChild(b);
  });
}

async function render(){
  nav();
  const c = STATE.country, d = await load(c), app = $("#app");
  if (!d) { app.innerHTML = emptyView(CONFIGS[c]); return; }
  const cfg = d.config, C = Object.keys(cfg.candidates), f = d.history[STATE.idx[c]];
  const order = C.map((n,i)=>i).sort((a,b)=>f.proj[b]-f.proj[a]);
  const lead = C[order[0]], second = C[order[1]];
  const mg = f.margin;
  const head = d.mode === "replay"
    ? `Repetición: ${esc(cfg.title)}${d.country === "us" ? " 2024" : ""}`
    : `${esc(cfg.title)}: ${esc(lead)} ${mg && mg.p_a_ahead>0.95 ? "proyectado adelante" : "levemente arriba"}`;
  const sub = d.mode === "replay"
    ? (d.replay_sub || `Reproduce el escrutinio de 2024 condado por condado, con la base 2020, en el orden aproximado de cierre por huso horario. Mové el control para ver qué decía la proyección en cada momento.`)
    : `Proyección del resultado final con ${pct(f.counted)} de los votos esperados ya escrutados (${f.units[0].toLocaleString("es-AR")} de ${f.units[1].toLocaleString("es-AR")} ${esc(cfg.unit_label)}). No es un resultado oficial.`;

  app.innerHTML = `
  <div class="headline"><h1>${head}</h1><p>${sub}</p></div>
  <div class="grid">
    <div><div class="cands">${order.map(i=>candRow(cfg,C,i,f,d)).join("")}</div>
      ${mg ? `<p class="cand sub" style="margin-top:14px">Diferencia proyectada: ${esc(mg.a)} ${pts(mg.mid)} pts sobre ${esc(mg.b)} (${pts(mg.lo)} a ${pts(mg.hi)}). Probabilidad de que ${esc(mg.a)} termine adelante: ${pct(mg.p_a_ahead,0)}.</p>`:""}
    </div>
    ${outcome(cfg,C,f,d)}
  </div>
  <section class="chart">
    <h2>Proyección y conteo a lo largo de la noche</h2>
    <div class="legend">${order.slice(0,2).map(i=>`<span style="color:${cfg.colors[C[i]]}"><i></i>${esc(C[i])} proyectado</span><span style="color:${cfg.colors[C[i]]}"><i class="dash"></i>conteo</span>`).join("")}${d.truth?`<span><i class="dot"></i>resultado final</span>`:""}</div>
    <div class="svgwrap">${chart(d,cfg,C,order.slice(0,2))}</div>
    ${d.history.length>1?`<div class="scrub">
      <button id="play" type="button">${STATE.playing?"Pausar":"Reproducir"}</button>
      <input id="slider" type="range" min="0" max="${d.history.length-1}" value="${STATE.idx[c]}" aria-label="Momento del escrutinio">
      <output id="sout">${pct(f.counted)} escrutado</output></div>`:""}
  </section>
  ${regionsView(d,cfg,C,f,order)}
  ${changesView(d,cfg,f)}
  ${d.backtest?methodView(d):""}`;
  const s = $("#slider");
  if (s) { s.oninput = e => { stop(); STATE.idx[c] = +e.target.value; render(); }; $("#play").onclick = togglePlay; }
  const m = $("#more"); if (m) m.onclick = () => { STATE.showAll = !STATE.showAll; render(); };
  const so = $("#sort"); if (so) so.onchange = e => { STATE.sort = e.target.value; render(); };
}

function candRow(cfg,C,i,f,d){
  const col = cfg.colors[C[i]], lo = f.lo?f.lo[i]:null, hi = f.hi?f.hi[i]:null, max = 0.6;
  const x = v => Math.min(100, v/max*100);
  return `<div class="cand">
    <div class="row1"><span class="name">${esc(C[i])}</span><span><span class="pct" style="color:${col}">${pct(f.proj[i])}</span>${lo!=null?`<span class="ci">${pct(lo)}–${pct(hi)}</span>`:""}</span></div>
    <div class="track" aria-hidden="true">
      ${lo!=null?`<div class="band" style="left:${x(lo)}%;width:${Math.max(.6,x(hi)-x(lo))}%;background:${col};opacity:var(--band)"></div>`:""}
      <div class="bar" style="width:${x(f.proj[i])}%;background:${col}"></div>
      <div class="tick" style="left:calc(${x(f.crude[i])}% - 1px)" title="Conteo"></div>
    </div>
    <div class="sub">Conteo hasta ahora: ${pct(f.crude[i])} (la marca negra)${d.truth?`. Resultado final: ${pct(d.truth.shares[i])}`:""}</div>
  </div>`;
}

function outcome(cfg,C,f,d){
  const r = f.rule;
  if (!r) return `<div class="outcome"><h2>Resultado</h2><p class="note">Todavía hay muy pocas unidades escrutadas para simular escenarios.</p></div>`;
  if (cfg.rule_kind === "ec") {
    const evs = C.map(n=>({n, v:r["ev_"+n]})).filter(o=>o.v && o.v.mid>0).sort((a,b)=>b.v.mid-a.v.mid);
    const tot = 538, sum = evs.reduce((s,o)=>s+o.v.mid,0);
    const winners = Object.entries(r.ganador||{}).sort((a,b)=>b[1]-a[1]);
    return `<div class="outcome"><h2>Colegio electoral proyectado</h2>
      <div class="big">${evs.map(o=>`<span style="color:${cfg.colors[o.n]}">${esc(o.n)} ${Math.round(o.v.mid)}</span>`).join(" · ")}</div>
      <div class="ev" role="img" aria-label="Votos electorales proyectados">${evs.map(o=>`<div style="width:${o.v.mid/tot*100}%;background:${cfg.colors[o.n]}"></div>`).join("")}<span class="half"></span></div>
      <div class="note" style="margin-top:0">La línea marca 270, la mayoría.</div>
      ${evs.map(o=>`<div class="line"><span>${esc(o.n)}</span><span>${Math.round(o.v.lo)}–${Math.round(o.v.hi)} votos electorales</span></div>`).join("")}
      ${winners.map(([n,p])=>`<div class="line"><span>${n==="sin mayoría"?"Nadie llega a 270":"Gana "+esc(n)}</span><strong>${pct(p,0)}</strong></div>`).join("")}
      ${d.truth&&d.truth.ev?`<div class="note">Resultado real: Trump 312, Harris 226.</div>`:""}
      <div class="note">${esc(cfg.note||"")}</div></div>`;
  }
  const res = Object.entries(r.resultado||{}).sort((a,b)=>b[1]-a[1]);
  const pb = typeof r.balotaje === "number" ? r.balotaje : null;
  return `<div class="outcome"><h2>¿Hay balotaje?</h2>
    ${pb!=null?`<div class="big">${pct(pb,0)} <span style="font-size:1rem;font-weight:500;font-stretch:100%">de probabilidad de segunda vuelta</span></div>`:""}
    ${res.map(([k,p])=>`<div class="line"><span>${esc(k)}</span><strong>${pct(p,0)}</strong></div>`).join("")}
    ${d.truth&&d.truth.text?`<div class="note">${esc(d.truth.text)}</div>`:""}
    <div class="note">${esc(cfg.note||"")}</div></div>`;
}

function chart(d,cfg,C,idx){
  const H = d.history, W = Math.round(Math.max(340, Math.min(760, (document.querySelector(".wrap").clientWidth||760) - 16))), Ht = W < 520 ? 280 : 320, m = {l:40,r:12,t:14,b:30};
  const xs = v => m.l + v*(W-m.l-m.r);
  let lo = 1, hi = 0;
  H.forEach(f => idx.forEach(i => { [f.proj[i], f.crude[i], f.lo?f.lo[i]:f.proj[i], f.hi?f.hi[i]:f.proj[i]].forEach(v=>{lo=Math.min(lo,v);hi=Math.max(hi,v);}); }));
  if (d.truth) idx.forEach(i=>{lo=Math.min(lo,d.truth.shares[i]);hi=Math.max(hi,d.truth.shares[i]);});
  lo = Math.floor(lo*50)/50 - .01; hi = Math.ceil(hi*50)/50 + .01;
  const ys = v => m.t + (hi-v)/(hi-lo)*(Ht-m.t-m.b);
  const path = (get) => H.map((f,k)=>`${k?"L":"M"}${xs(f.counted).toFixed(1)},${ys(get(f)).toFixed(1)}`).join("");
  let g = "";
  const step = (hi - lo) > .2 ? .04 : .02;
  for (let v = Math.ceil(lo/step)*step; v <= hi + 1e-9; v += step) g += `<line x1="${m.l}" x2="${W-m.r}" y1="${ys(v)}" y2="${ys(v)}" stroke="var(--rule)"/><text x="${m.l-6}" y="${ys(v)+4}" text-anchor="end">${Math.round(v*100)}%</text>`;
  [0,.25,.5,.75,1].forEach(v => g += `<text x="${xs(v)}" y="${Ht-8}" text-anchor="middle">${Math.round(v*100)}%</text>`);
  g += `<text x="${W-m.r}" y="${Ht-20}" text-anchor="end">votos escrutados</text>`;
  idx.forEach(i => {
    const col = cfg.colors[C[i]];
    const withCI = H.filter(f=>f.lo);
    if (withCI.length > 1) {
      const top = withCI.map((f,k)=>`${k?"L":"M"}${xs(f.counted).toFixed(1)},${ys(f.hi[i]).toFixed(1)}`).join("");
      const bot = withCI.slice().reverse().map(f=>`L${xs(f.counted).toFixed(1)},${ys(f.lo[i]).toFixed(1)}`).join("");
      g += `<path d="${top}${bot}Z" fill="${col}" opacity="var(--band)" style="opacity:var(--band)"/>`;
    }
    g += `<path d="${path(f=>f.crude[i])}" fill="none" stroke="${col}" stroke-width="1.6" stroke-dasharray="5 4"/>`;
    g += `<path d="${path(f=>f.proj[i])}" fill="none" stroke="${col}" stroke-width="2.6"/>`;
    if (d.truth) g += `<line x1="${m.l}" x2="${W-m.r}" y1="${ys(d.truth.shares[i])}" y2="${ys(d.truth.shares[i])}" stroke="${col}" stroke-dasharray="1 4" stroke-width="2"/>`;
  });
  const cur = H[STATE.idx[STATE.country]];
  g += `<line x1="${xs(cur.counted)}" x2="${xs(cur.counted)}" y1="${m.t}" y2="${Ht-m.b}" stroke="var(--ink)" stroke-width="1"/>`;
  idx.forEach(i => g += `<circle cx="${xs(cur.counted)}" cy="${ys(cur.proj[i])}" r="4.5" fill="${cfg.colors[C[i]]}" stroke="var(--sheet)" stroke-width="2"/>`);
  return `<svg viewBox="0 0 ${W} ${Ht}" role="img" aria-label="Evolución de la proyección y del conteo">${g}</svg>`;
}

function regionsView(d,cfg,C,f,order){
  const a = order[0], b = order[1], R = d.regions;
  let rows = R.map((name,r)=>({name, cnt:f.regions.counted[r], p:f.regions.proj[r], v:f.regions.votes[r], pa:f.regions.p_ahead?f.regions.p_ahead[r]:null}));
  const key = {close:o=>Math.abs(o.p[a]-o.p[b]), votes:o=>-o.v, counted:o=>o.cnt, name:o=>o.name}[STATE.sort];
  rows.sort((x,y)=> STATE.sort==="name" ? x.name.localeCompare(y.name) : key(x)-key(y));
  const shown = STATE.showAll ? rows : rows.slice(0,12);
  const ca = cfg.colors[C[a]], cb = cfg.colors[C[b]];
  return `<section class="regions"><h2>Por ${esc(cfg.region_label.toLowerCase())}</h2>
  <div class="tools"><label for="sort">Ordenar por</label><select id="sort">
    ${[["close","más reñidos"],["votes","más votos"],["counted","menos escrutados"],["name","nombre"]].map(([k,l])=>`<option value="${k}" ${STATE.sort===k?"selected":""}>${l}</option>`).join("")}</select></div>
  <div class="tablewrap"><table><thead><tr><th>${esc(cfg.region_label)}</th><th>Escrutado</th><th>${esc(C[a])}</th><th>${esc(C[b])}</th><th>Diferencia</th>${rows[0].pa!=null?`<th>P(${esc(C[a])} adelante)</th>`:""}</tr></thead><tbody>
  ${shown.map(o=>{ const dm=o.p[a]-o.p[b], w=Math.min(50,Math.abs(dm)*250);
    return `<tr><td>${esc(o.name)}</td><td>${pct(o.cnt,0)}</td><td>${pct(o.p[a])}</td><td>${pct(o.p[b])}</td>
    <td>${pts(dm)}<span class="mbar"><span style="${dm>=0?`left:50%;width:${w}%;background:${ca}`:`right:50%;width:${w}%;background:${cb}`}"></span></span></td>
    ${o.pa!=null?`<td>${pct(o.pa,0)}</td>`:""}</tr>`;}).join("")}
  </tbody></table></div>
  ${rows.length>12?`<button class="more" id="more" type="button">${STATE.showAll?"Mostrar menos":`Mostrar los ${rows.length}`}</button>`:""}</section>`;
}

function changesView(d,cfg,f){
  const A = f.analysis; if (!A) return "";
  const ca = cfg.colors[A.a], cb = cfg.colors[A.b], md = A.margin_delta, toward = md >= 0 ? A.a : A.b;
  const u = esc(cfg.unit_label||"unidades"), rl = esc((cfg.region_label||"región").toLowerCase());
  const art = /[aá]$|ón$/.test(rl) ? "La" : "El";
  const chg = Object.entries(A.change).filter(([n,v]) => Math.abs(v.delta) > 0.001 || v.now > 0.02);
  const lead = `Comparando los mismos ${A.units.toLocaleString("es-AR")} ${u} ya escrutados con la elección anterior, la diferencia entre ${esc(A.a)} y ${esc(A.b)} se movió <strong>${Math.abs(md*100).toFixed(1).replace(".",",")} puntos hacia ${esc(toward)}</strong>.`;
  const cards = chg.map(([n,v]) => `<div class="card"><div class="k">${esc(n)}${v.shared_group?" (grupo)":""}</div>
     <div class="v" style="color:${cfg.colors[n]||"var(--ink)"}">${pts(v.delta)}</div>
     <div class="s">${pct(v.base)} → ${pct(v.now)}${v.shared_group?", contra el grupo de la base":""}</div></div>`).join("")
   + (A.polls && A.polls.error!=null ? `<div class="card"><div class="k">Contra las encuestas</div><div class="v">${pts(A.polls.error)}</div><div class="s">La proyección da ${esc(A.a)} ${pts(f.margin.mid)}; las encuestas, ${pts(A.polls.margin)}${A.polls.source?` (${esc(A.polls.source)})`:""}</div></div>` : "");
  // flechas por región
  const R = A.by_region, W = 560, rowH = 18, H = R.length*rowH + 30, nameW = 128, valW = 46;
  const lo = Math.min(0, ...R.map(r=>r.delta)), hi = Math.max(0, ...R.map(r=>r.delta)), span = Math.max(hi - lo, .01);
  const xL = nameW + (lo < 0 ? valW : 0), xR = W - (hi > 0 ? valW : 6), sc = (xR - xL)/span, x0 = xL - lo*sc;
  let g = `<line x1="${x0}" x2="${x0}" y1="4" y2="${H-22}" stroke="var(--ink)" stroke-width="1"/>`;
  R.forEach((r,i) => { const y = 8 + i*rowH + rowH/2, x1 = x0 + r.delta*sc, col = r.delta >= 0 ? ca : cb;
    g += `<text x="${nameW-8}" y="${y+4}" text-anchor="end">${esc(r.region)}</text>`;
    g += `<line x1="${x0}" x2="${x1}" y1="${y}" y2="${y}" stroke="${col}" stroke-width="5" stroke-linecap="round"/>`;
    g += `<text x="${x1 + (r.delta>=0?6:-6)}" y="${y+4}" text-anchor="${r.delta>=0?"start":"end"}" style="fill:var(--ink)">${pts(r.delta)}</text>`; });
  g += `${hi>0?`<text x="${x0+6}" y="${H-6}">hacia ${esc(A.a)} →</text>`:""}${lo<0?`<text x="${x0-6}" y="${H-6}" text-anchor="end">← hacia ${esc(A.b)}</text>`:""}`;
  const arrows = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Cambio de la diferencia por ${rl}">${g}</svg>`;
  // por tamaño
  const Z = A.by_size, mz = Math.max(...Z.map(z=>Math.abs(z.delta)), .01), W2 = 420, H2 = Z.length*34 + 10;
  let g2 = ""; Z.forEach((z,i) => { const y = 6 + i*34, w = Math.abs(z.delta)/mz*(W2-170), col = z.delta>=0?ca:cb;
    g2 += `<text x="0" y="${y+14}" style="fill:var(--ink)">${esc(z.label)}</text><text x="0" y="${y+28}" font-size="11">${Math.round(z.share_votes*100)}% de los votos</text>`;
    g2 += `<rect x="130" y="${y+6}" width="${Math.max(2,w)}" height="16" rx="3" fill="${col}"/><text x="${136+w}" y="${y+19}" style="fill:var(--ink)">${pts(z.delta)}</text>`; });
  const sizes = `<svg viewBox="0 0 ${W2} ${H2}" role="img" aria-label="Cambio por tamaño">${g2}</svg>`;
  // persistencia: el frame más cercano con muestra
  let sf = null; const H0 = d.history, k0 = STATE.idx[STATE.country];
  for (let k = k0; k >= 0; k--) if (H0[k].analysis && H0[k].analysis.scatter) { sf = H0[k].analysis; break; }
  let scat = "";
  if (sf) { const P = sf.scatter, Ws = 360, Hs = 300, m = 34, lim = Math.min(1, Math.max(.3, ...P.map(p=>Math.max(Math.abs(p[0]),Math.abs(p[1])))));
    const X = v => m + (v+lim)/(2*lim)*(Ws-m-8), Y = v => 8 + (lim-v)/(2*lim)*(Hs-m-8);
    let gs = `<rect x="${m}" y="8" width="${Ws-m-8}" height="${Hs-m-8}" fill="none" stroke="var(--rule)"/>`;
    gs += `<line x1="${X(0)}" x2="${X(0)}" y1="8" y2="${Hs-m}" stroke="var(--rule)"/><line x1="${m}" x2="${Ws-8}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--rule)"/>`;
    gs += `<line x1="${X(-lim)}" y1="${Y(-lim)}" x2="${X(lim)}" y2="${Y(lim)}" stroke="var(--ink)" stroke-dasharray="4 4"/>`;
    P.forEach(p => { const col = p[1] >= 0 ? ca : cb; gs += `<circle cx="${X(p[0]).toFixed(1)}" cy="${Y(p[1]).toFixed(1)}" r="${(1+ (p[2]-2)*0.7).toFixed(1)}" fill="${col}" fill-opacity=".45"/>`; });
    gs += `<text x="${(Ws+m)/2}" y="${Hs-6}" text-anchor="middle">diferencia en la elección anterior</text><text x="10" y="${(Hs-m)/2}" transform="rotate(-90 10 ${(Hs-m)/2})" text-anchor="middle">diferencia ahora</text>`;
    scat = `<div class="panel"><h3>La geografía se mantiene</h3><p class="cap">Cada punto es uno de los ${u}; el tamaño, sus votos. Sobre la diagonal, no cambió nada. Correlación entre ambas elecciones: ${sf.persistence.toFixed(2).replace(".",",")}.</p><svg viewBox="0 0 ${Ws} ${Hs}" role="img" aria-label="Diferencia anterior contra actual">${gs}</svg></div>`; }
  const F = A.flips, flipList = (arr, who) => arr.length ? `<ul class="flips">${arr.slice(0,6).map(x=>`<li>${esc(x.name)} (${esc(x.region)}): ${pts(x.base)} → ${pts(x.now)}</li>`).join("")}</ul>` : "";
  const flipsTxt = `<div class="panel"><h3>Cambios de ganador</h3>
    <p class="cap">Entre los ${u} ya completos, ${F.to_a.toLocaleString("es-AR")} pasaron a ${esc(A.a)} y ${F.to_b.toLocaleString("es-AR")} a ${esc(A.b)}. Había ${F.vulnerable.toLocaleString("es-AR")} que el perjudicado por el corrimiento había ganado por menos de ${Math.abs(md*100).toFixed(1).replace(".",",")} puntos, lo mismo que se movió el total; ${F.vulnerable_flipped.toLocaleString("es-AR")} cambiaron de mano.</p>
    ${F.to_a?`<p class="cap" style="margin-top:6px">Los más grandes que pasaron a ${esc(A.a)} (diferencia de ${esc(A.a)} sobre ${esc(A.b)}, antes → ahora):</p>${flipList(F.top_to_a, A.a)}`:""}
    ${F.to_b?`<p class="cap" style="margin-top:6px">Los más grandes que pasaron a ${esc(A.b)}:</p>${flipList(F.top_to_b, A.b)}`:""}</div>`;
  return `<section class="changes"><h2>Qué cambió respecto de la elección anterior</h2>
   <p class="lead">${lead}</p><div class="cards">${cards}</div>
   <div class="two"><div class="panel"><h3>Por ${rl}</h3><p class="cap">El largo indica cuántos puntos cambió la diferencia entre ${esc(A.a)} y ${esc(A.b)}, en los ${u} ya escrutados.</p>${arrows}</div>
   <div style="display:flex;flex-direction:column;gap:22px"><div class="panel"><h3>Por tamaño</h3><p class="cap">Según los votos válidos que tenía cada uno en la elección anterior.</p>${sizes}</div>
   <div class="panel"><h3>¿Fue parejo?</h3><p class="cap" style="font-size:.92rem;color:var(--ink)">En el ${pct(A.same_dir,0)} de los ${u} (ponderados por votos) la diferencia se movió en el mismo sentido que el total. ${art} ${rl} explica el ${pct(Math.max(0,A.r2_region),0)} de la variación del cambio entre ${u}; el resto es local.</p></div></div></div>
   <div class="two" style="margin-top:22px">${scat}${flipsTxt}</div></section>`;
}

function methodView(d){
  if (d.backtest.cal === "EEUU") return methodViewOther(d);
  const bt = d.backtest, show = [0,1,2,4,6,8], names = {crudo:"Conteo crudo",swing_reg:"Swing regional",vecinos:"Vecinos",modelo:"Modelo jerárquico",ensamble:"Ensamble (esta página)"};
  const best = show.map(k => Math.min(...bt.methods.filter(m=>m!=="crudo").map(m=>bt.mae[m][k])));
  return `<section class="method"><h2>Qué tan bien funciona</h2>
  <p>Para validar el método se re-escrutó la elección 2024 en ${bt.n_orders} órdenes de llegada distintos (algunos con sesgo fuerte: primero lo urbano, primero un partido, primero el este), usando sólo lo que se sabía en cada momento. La tabla muestra el error medio en el margen entre los dos primeros, en puntos, según cuánto se había contado. Los parámetros se eligieron con 2016→2020, sin mirar 2024.</p>
  <div class="tablewrap"><table><thead><tr><th>Método</th>${show.map(k=>`<th>${Math.round(bt.cuts[k]*100)}%</th>`).join("")}</tr></thead><tbody>
  ${bt.methods.map(m=>`<tr><td>${names[m]}</td>${show.map((k,j)=>{const v=bt.mae[m][k];return `<td class="${m!=="crudo"&&Math.abs(v-best[j])<1e-9?"best":""}">${v.toFixed(2).replace(".",",")}</td>`;}).join("")}</tr>`).join("")}
  </tbody></table></div>
  <p>En 2024 los cuatro métodos quedan muy cerca entre sí y ninguno domina. La diferencia aparece en las otras elecciones: en 2016→2020 el ensamble tuvo un error medio de ${(bt.mae_2020.ensamble).toFixed(2).replace(".",",")} puntos contra ${(bt.mae_2020.modelo).toFixed(2).replace(".",",")} del modelo solo y ${(bt.mae_2020.swing_reg).toFixed(2).replace(".",",")} del swing regional, y en Argentina 2019 el swing regional se equivocó el triple que el ensamble. Por eso la página usa modelo + vecinos: no es el mejor en cada elección, pero es el que nunca queda lejos del mejor. El ensamble acertó el ganador del colegio electoral en todas las corridas; el conteo crudo señalaba al equivocado en la mayoría de los casos hasta la mitad del escrutinio. Todos los métodos subestiman el margen de Trump en 2024, porque las grandes ciudades giraron más de lo que anticipaba la base.</p>
  <p>El intervalo es la parte más frágil. Calibrado con 2020, el intervalo del 90% contuvo el margen real ${pct(bt.coverage_global,0)} de las veces en 2024; calibrado con 2024, contuvo el de 2020 ${pct(bt.coverage_other,0)} de las veces. Esta repetición usa la calibración de 2020, así que sus bandas son más angostas de lo que deberían. Para elecciones futuras se usa una calibración conjunta de ambas.</p>
  </section>`;
}

function methodViewOther(d){
  const bt = d.backtest, show = [0,1,2,4,6,8], names = {crudo:"Conteo crudo",swing_reg:"Swing regional",vecinos:"Vecinos",modelo:"Modelo jerárquico",ensamble:"Ensamble (esta página)"};
  const best = show.map(k => Math.min(...bt.methods.filter(m=>m!=="crudo").map(m=>bt.mae[m][k])));
  const ok = m => pct(bt.regla[m],0);
  return `<section class="method"><h2>Qué tan bien funciona</h2>
  <p>Se re-escrutó ${esc(bt.eval)} en ${bt.n_orders} órdenes de llegada distintos (${bt.units.toLocaleString("es-AR")} unidades), con los parámetros y la calibración elegidos en Estados Unidos, sin ajustar nada para este país. Es una prueba fuera de muestra doble: otra elección y otro sistema político. La tabla muestra el error medio en el margen entre los dos primeros, en puntos.</p>
  <div class="tablewrap"><table><thead><tr><th>Método</th>${show.map(k=>`<th>${Math.round(bt.cuts[k]*100)}%</th>`).join("")}<th>Escenario correcto</th></tr></thead><tbody>
  ${bt.methods.map(m=>`<tr><td>${names[m]}</td>${show.map((k,j)=>{const v=bt.mae[m][k];return `<td class="${m!=="crudo"&&Math.abs(v-best[j])<1e-9?"best":""}">${v.toFixed(2).replace(".",",")}</td>`;}).join("")}<td>${ok(m)}</td></tr>`).join("")}
  </tbody></table></div>
  ${d.country === "ar" ? `<p>Para 2027 hace falta la base 2023 por mesa de la DINE (<code>python -m adapters.ar archivo.csv</code>), el mapeo de frentes cuando se oficialicen las listas y el feed del escrutinio provisorio (<code>adapters/ar_live.py</code>).</p>` : ""}
  <p>"Escenario correcto" es la proporción de cortes en que el método anticipaba bien si había o no segunda vuelta. Con la calibración traída de Estados Unidos, el intervalo del 90% contuvo el margen real el ${pct(bt.coverage_global,0)} de las veces. Para la noche electoral, este país usa un promedio de esa calibración y la que surge de su propio backtest.</p>
  </section>`;
}

function emptyView(cfg){
  return `<div class="headline"><h1>${esc(cfg.title)}: sin datos cargados</h1><p>${esc(cfg.office)}. ${esc(cfg.note)}</p></div>
  <div class="empty"><h2>Para activar este país</h2><ol>${cfg.setup.map(s=>`<li>${s}</li>`).join("")}</ol>
  <p>Candidatos configurados: ${Object.keys(cfg.candidates).map(esc).join(", ")}. Hasta tener un backtest propio, el país usa los parámetros y la calibración de Estados Unidos.</p></div>`;
}

function togglePlay(){
  if (STATE.playing) { stop(); render(); return; }
  const c = STATE.country, d = STATE.data[c];
  if (STATE.idx[c] >= d.history.length-1) STATE.idx[c] = 0;
  STATE.playing = setInterval(() => { if (STATE.idx[c] >= d.history.length-1) { stop(); } else STATE.idx[c]++; render(); }, 450);
  render();
}
function stop(){ if (STATE.playing) { clearInterval(STATE.playing); STATE.playing = null; } }

let rz; window.addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(render, 150); });
const h = location.hash.slice(1); if (ORDER.includes(h)) STATE.country = h;
render();
if (!window.__DATA__) setInterval(async () => { if (STATE.data[STATE.country] && STATE.data[STATE.country].mode === "live") { STATE.data[STATE.country] = undefined; await render(); } }, 120000);
</script>
</body>
</html>
